<title>FotoAuto Estudos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estilo app; botão grande de câmera no topo, respostas em cartões abaixo */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #15202b; --muted: #5b6b7a;
  --accent: #0a7cff; --accent-fg: #ffffff; --line: #dde3ea; --ok: #1b9e5a; --err: #c62828; --chip: #e6f0ff;
  --display: "Space Grotesk", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1418; --surface: #182128; --fg: #e8eef3; --muted: #93a3b1;
  --accent: #4ba3ff; --accent-fg: #06121e; --line: #26323c; --ok: #4fd18b; --err: #ff7b7b; --chip: #15324f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #182128; --fg: #e8eef3; --muted: #93a3b1;
  --accent: #4ba3ff; --accent-fg: #06121e; --line: #26323c; --ok: #4fd18b; --err: #ff7b7b; --chip: #15324f; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--display); font-size: 2rem; margin: 0; letter-spacing: -0.02em; }
.lead { color: var(--muted); margin: 4px 0 0; }
.pick { display: flex; flex-direction: column; gap: 10px; }
.btn { appearance: none; border: 0; border-radius: 14px; padding: 18px 20px; font: 600 1.1rem var(--body);
  background: var(--accent); color: var(--accent-fg); cursor: pointer; text-align: center; display: block; }
.btn.secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--line); font-size: 1rem; padding: 14px 20px; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type=file] { display: none; }
.status { color: var(--muted); font-size: .95rem; min-height: 1.5em; }
.status.err { color: var(--err); }
.list { display: flex; flex-direction: column; gap: 16px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.item img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 10px; background: var(--bg); }
.chip { align-self: flex-start; background: var(--chip); color: var(--accent); font-weight: 600; font-size: .8rem;
  text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; }
.answer { min-width: 0; overflow-wrap: anywhere; }
.answer h3 { font-family: var(--display); font-size: 1.05rem; margin: 14px 0 4px; }
.answer h3:first-child { margin-top: 0; }
.answer p { margin: 0 0 8px; }
.answer .final { color: var(--ok); font-weight: 600; }
.answer.err { color: var(--err); }
.thinking { color: var(--muted); font-style: italic; }
</style>

<div class="wrap">
  <header>
    <h1>FotoAuto Estudos</h1>
    <p class="lead">Tire a foto da questão e receba na hora a matéria, a resposta certa e a explicação passo a passo.</p>
  </header>

  <div class="pick">
    <label class="btn" for="cam">📷 Fotografar questão</label>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <label class="btn secondary" for="gal">Escolher da galeria</label>
    <input id="gal" type="file" accept="image/*" multiple>
    <div id="status" class="status">Pronto. A primeira vez o Claude pede sua permissão para ler as fotos.</div>
  </div>

  <div id="list" class="list"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (async () => { try { return await window.claude?.use?.("sample"); } catch { return null; } })();
  return samplePromise;
}

const PROMPT = `Você é um professor brasileiro experiente. A imagem é a foto de uma ou mais questões (prova, lista ou livro).
Para CADA questão visível, responda em português do Brasil exatamente neste formato:

## Matéria: <nome da matéria, ex.: Matemática, Física, Química, Biologia, História, Geografia, Português, Inglês, Filosofia, Sociologia>
## Questão <número ou resumo curto>
<explicação passo a passo, clara e curta, como para um estudante>
**Resposta final:** <a resposta; se for múltipla escolha, a letra e o texto da alternativa>

Confira as contas antes de responder. Se a foto estiver ilegível ou cortada, diga o que não deu para ler e peça uma nova foto. Não use tabelas nem LaTeX; escreva fórmulas em texto simples (ex.: x² + 3x = 10).`;

function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res({ blob: b, url }) : rej(new Error("Falha ao preparar a foto")), "image/jpeg", 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Formato de imagem não suportado")); };
    img.src = url;
  });
}

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function renderAnswer(el, chip, text) {
  const subjects = [...text.matchAll(/^##\s*Mat[ée]ria:\s*(.+)$/gmi)].map(m => m[1].trim());
  const uniq = [...new Set(subjects)];
  if (uniq.length) { chip.textContent = uniq.join(" · "); chip.hidden = false; }
  const html = text.split(/\n/).map(line => {
    if (/^##\s*Mat[ée]ria:/i.test(line)) return "";
    if (/^#{1,3}\s+/.test(line)) return `<h3>${esc(line.replace(/^#{1,3}\s+/, ""))}</h3>`;
    if (!line.trim()) return "";
    let l = esc(line).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    const cls = /^\s*(<b>)?Resposta final/i.test(l) ? ' class="final"' : "";
    return `<p${cls}>${l}</p>`;
  }).join("");
  el.innerHTML = html || '<p class="thinking">Pensando…</p>';
}

async function handle(file) {
  const card = document.createElement("div");
  card.className = "item";
  card.innerHTML = `<img alt="Foto da questão"><span class="chip" hidden></span><div class="answer"><p class="thinking">Lendo a questão…</p></div>`;
  $("list").prepend(card);
  const ans = card.querySelector(".answer"), chip = card.querySelector(".chip");
  try {
    const { blob, url } = await shrink(file);
    card.querySelector("img").src = url;
    const sample = await getSample();
    if (!sample) throw { message: "Não consegui falar com o Claude nesta tela. Abra o link no navegador com sua conta do Claude." };
    const out = await sample(PROMPT, {
      images: [blob], modelTier: "complex", cache: false,
      onText: ({ text }) => renderAnswer(ans, chip, text)
    });
    renderAnswer(ans, chip, out.text);
  } catch (e) {
    ans.className = "answer err";
    const msg = e?.code === "not_granted" ? "Você não permitiu o acesso ao Claude. Libere nas permissões da página e tente de novo."
      : e?.code === "rate_limited" ? "Muitas perguntas seguidas. Espere um minuto e tente de novo."
      : e?.code === "images_unavailable" ? "Esta tela não consegue enviar fotos. Abra o link no Safari com sua conta do Claude."
      : (e?.message || "Algo deu errado. Tente outra foto.");
    ans.innerHTML = `<p>${esc(msg)}</p>`;
  }
}

async function onPick(e) {
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length) return;
  $("status").textContent = files.length > 1 ? `Respondendo ${files.length} fotos…` : "Respondendo…";
  for (const f of files) await handle(f);
  $("status").textContent = "Pronto. Tire outra foto quando quiser.";
}
$("cam").addEventListener("change", onPick);
$("gal").addEventListener("change", onPick);
</script>
